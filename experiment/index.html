<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081629">
<meta name="description" content="ORBIT LAB：自由疊加圓周，直接畫出軌跡，用傅立葉變換讓圓自動重建手繪線條。">
<title>ORBIT LAB｜軌跡實驗室</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="workspace">
 <header class="topbar">
  <a class="brand" href="../" aria-label="返回 ORBIT CODE 正式遊戲"><span class="mark">◎</span><span><strong>ORBIT <em>LAB</em></strong><small>軌跡實驗室</small></span></a>
  <div class="modes" role="group" aria-label="操作模式">
   <button id="freeMode" class="mode current" type="button" aria-pressed="true">自由加圈</button>
   <button id="drawMode" class="mode" type="button" aria-pressed="false">手繪軌跡</button>
  </div>
  <div class="topactions">
   <button id="settingsBtn" class="iconbtn" type="button" aria-expanded="false" aria-controls="advancedPanel" aria-label="開啟細節設定" title="細節設定">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg>
   </button>
   <a class="back" href="../">返回遊戲 <span aria-hidden="true">↗</span></a>
  </div>
 </header>
 <section class="stage" id="stage" aria-label="軌跡運動畫布">
  <canvas id="plot" aria-label="自由模式顯示多個圓周運動，手繪模式可以直接在畫布上描繪軌跡。"></canvas>
  <div class="canvas-top">
   <div id="status" class="status" role="status" aria-live="polite">調整圓周，觀察路徑</div>
   <div class="legend" aria-hidden="true"><span class="swatch track"></span>軌跡 <span class="swatch original"></span>手繪</div>
  </div>
  <p id="canvasHint" class="hint">切換到「手繪軌跡」，在畫布上用手指或滑鼠畫線</p>
  <aside id="advancedPanel" class="advanced" aria-label="進階圓周設定" hidden>
   <div class="panel-title"><h2>圓周微調</h2><button id="closeSettings" type="button" class="close" aria-label="收起設定">×</button></div>
   <label class="rowlabel" for="wheelSelect">選擇圓周</label>
   <select id="wheelSelect" aria-label="選擇要調整的圓周"></select>
   <label class="rowlabel" for="radius">半徑 <output id="radiusOut">90</output></label>
   <input id="radius" type="range" min="0" max="300" step="1" value="90">
   <label class="rowlabel" for="radiusNumber">精確半徑</label><input id="radiusNumber" type="number" min="0" max="1000" step="1" value="90">
   <label class="rowlabel" for="frequency">頻率 / 旋轉方向</label>
   <input id="frequency" type="number" min="-2048" max="2048" step="1" value="1">
   <p class="help">正數順轉、負數逆轉；數值越大轉得越快。</p>
   <label class="rowlabel" for="phase">起始角度 <output id="phaseOut">0°</output></label>
   <input id="phase" type="range" min="-180" max="180" value="0" step="1">
   <div class="switches">
    <label><input id="showRings" type="checkbox" checked> 顯示圓周</label>
    <label><input id="showOriginal" type="checkbox" checked> 顯示手繪線</label>
    <label><input id="showForecast" type="checkbox" checked> 顯示完整軌跡</label>
   </div>
   <p class="help">此處的編輯只影響實驗，不會更改正式遊戲的關卡或存檔。</p>
  </aside>
 </section>
 <div class="bottom">
  <div class="primarycontrols">
   <button id="playBtn" class="play" type="button"><span aria-hidden="true">▶</span> <span id="playText">開始播放</span></button>
   <div class="count" role="group" aria-label="使用圓周數">
    <button id="minusBtn" type="button" aria-label="減少一個圓周">−</button>
    <label for="countInput">圓周 <input id="countInput" type="number" min="1" max="2048" step="1" value="3" inputmode="numeric"></label>
    <button id="plusBtn" type="button" aria-label="增加一個圓周">+</button>
   </div>
   <label class="speed" for="speedSlider">速度 <input id="speedSlider" type="range" min="10" max="250" value="100" step="10"><output id="speedOut">1.0×</output></label>
  </div>
  <div class="secondarycontrols">
   <button id="generateBtn" class="generate" type="button" disabled>依手繪生成圓周</button>
   <button id="clearBtn" class="quiet" type="button">清空線條</button>
   <button id="resetBtn" class="quiet" type="button">重設</button>
  </div>
 </div>
</main>
<script src="./app.js"></script>
</body></html>
