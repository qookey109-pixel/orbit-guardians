      - name: Install WebKit engine
        run: npx playwright install --with-deps webkit
      - name: Cross-browser WebKit smoke (desktop and mobile)
        run: |
          curl -sf http://127.0.0.1:8765/ >/dev/null || (python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/orbit-webkit-server.log 2>&1 & sleep 1)
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { webkit } from 'playwright';
          const browser=await webkit.launch({headless:true});
          const errors=[],page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
          assert.equal(await page.title(),'ORBIT // CODE｜軌道守護者');
          assert.equal(await page.evaluate(()=>typeof Path2D),'function','WebKit Path2D support required');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__?.levels?.length),18);
          assert.equal(await page.locator('#startBtn .ui-icon use').getAttribute('href'),'#oi-launch');
          await page.locator('#startBtn').click();
          assert.equal(await page.locator('#startBtn .ui-icon use').getAttribute('href'),'#oi-pause','WebKit launch icon');
          await page.locator('#startBtn').click();
          assert.equal(await page.locator('#startBtn .ui-icon use').getAttribute('href'),'#oi-launch','WebKit pause icon');
          await page.locator('#resetBtn').click();
          assert.equal(await page.locator('#planetBar .planet-btn').count(),3);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          assert.ok(await page.evaluate(()=>window.__ORBIT_DEBUG__.renderPerf.forecastBuilds>=1));
          const perfBefore=await page.evaluate(()=>({...window.__ORBIT_DEBUG__.renderPerf}));
          await page.waitForTimeout(160);
          // WebKit headless may throttle requestAnimationFrame; prove reuse with explicit redraws.
          await page.evaluate(()=>{for(let i=0;i<4;i++)window.__ORBIT_DEBUG__.draw()});
          const perfAfter=await page.evaluate(()=>({...window.__ORBIT_DEBUG__.renderPerf}));
          assert.equal(perfAfter.forecastBuilds,perfBefore.forecastBuilds,'Safari idle preview recalculated');
          assert.ok(perfAfter.forecastHits>perfBefore.forecastHits,'Safari failed to reuse Path2D preview');
          const radialChange=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__,before=d.renderPerf.forecastBuilds,initial=d.state.wheels[0].r;
            d.updateWheel(0,'r',Math.min(165,initial+1));
            return {before,after:d.renderPerf.forecastBuilds,radius:d.state.wheels[0].r,initial};
          });
          assert.equal(radialChange.radius,radialChange.initial+1);
          assert.ok(radialChange.after>radialChange.before,'Changing a radius must invalidate cached prediction');
          const screenshot=async (name)=>page.screenshot({path:name,fullPage:true});
          await screenshot('webkit-desktop-v118.png');
          for(const size of [{width:390,height:844},{width:320,height:568},{width:844,height:390}]){
            await page.setViewportSize(size);
            await page.waitForTimeout(120);
            const fit=await page.evaluate(()=>({
              scrollX:document.documentElement.scrollWidth-innerWidth,
              scrollY:document.documentElement.scrollHeight-innerHeight,
              canvas:document.querySelector('#gameCanvas').getBoundingClientRect().height,
              dock:document.querySelector('.mobile-dock').getBoundingClientRect().height,
              preview:document.querySelector('#previewBtn').getAttribute('aria-pressed')
            }));
            assert.ok(fit.scrollX<2&&fit.scrollY<2,'WebKit viewport overflow: '+JSON.stringify({size,fit}));
            assert.ok(fit.canvas>=size.height-2,'WebKit canvas not full viewport: '+JSON.stringify({size,fit}));
            assert.ok(fit.dock>=35,'WebKit mobile dock missing: '+JSON.stringify({size,fit}));
            assert.equal(fit.preview,'true');
          }
          await page.setViewportSize({width:390,height:844});
          await page.locator('#dockSettings').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true);
          assert.equal(await page.locator('#mobileSheetDismiss').isVisible(),true);
          await page.locator('#mobileSheetDismiss').click({position:{x:20,y:250}});
          assert.equal(await page.locator('#settingsPanel').isVisible(),false);
          await page.locator('#dockLevels').click();
          assert.equal(await page.locator('#levelsSection').isVisible(),true);
          await page.keyboard.press('Escape');
          assert.equal(await page.locator('#levelsSection').isVisible(),false);
          await screenshot('webkit-mobile-v118.png');
          const reducedPage=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          reducedPage.on('pageerror',e=>errors.push(String(e)));
          await reducedPage.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
          assert.equal(await reducedPage.evaluate(()=>matchMedia('(prefers-reduced-motion: reduce)').matches),true);
          assert.equal(await reducedPage.evaluate(()=>getComputedStyle(document.querySelector('#previewBtn .preview-led')).animationName),'none');
          assert.deepEqual(errors,[],'WebKit had uncaught errors');
          await browser.close();
          NODE
