name: Orbit V1.2 console HUD QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check game in Chromium (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/orbit-server.log 2>&1 &
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
          assert.match(await page.title(),/Console HUD V1\.2/);
          const checks=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            return {stages:d?.levels?.length,max:d?.MAX_WHEELS,styleCount:document.querySelectorAll('style').length,hiddenDecor:getComputedStyle(document.querySelector('.space-caption')).display==='none',noOldScanline:getComputedStyle(document.body,'::after').content==='none',visual:d?.visual,overflow:document.documentElement.scrollWidth-innerWidth,verticalOverflow:document.documentElement.scrollHeight-innerHeight,canvasHeight:document.querySelector('#boardArea').getBoundingClientRect().height};
          });
          assert.deepEqual(checks.stages,18);
          assert.equal(checks.visual.planets,3);
          assert.equal(checks.visual.levelsPerPlanet,6);
          assert.equal(await page.locator('#planetBar .planet-btn').count(),3);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked),1);
          assert.deepEqual(checks.max,3);
          assert.equal(checks.visual.ship,'round-scout');
          assert.equal(checks.visual.goal,'supply-station');
          assert.equal(checks.visual.hazard,'navigation-mine');
          assert.equal(checks.visual.layout,'console-hud');
          assert.equal(checks.visual.background,'classic-cosmos');
          assert.equal(checks.visual.completion,'nonmodal');
          assert.equal(checks.visual.timeLimit,false);
          assert.equal(checks.visual.onboarding,true);
          assert.equal(checks.visual.prediction,'hazard-aware');
          assert.equal(checks.visual.scores,'persistent-best');
          assert.deepEqual(checks.styleCount,1);
          assert.equal(checks.hiddenDecor,true);
          assert.equal(checks.noOldScanline,true);
          assert.ok(checks.overflow<2,'Desktop horizontal overflow '+checks.overflow);
          assert.ok(checks.verticalOverflow<2,'Desktop vertical overflow '+checks.verticalOverflow);
          assert.ok(checks.canvasHeight>=890,'Desktop playfield must fill the viewport: '+checks.canvasHeight);
          const immersive=await page.evaluate(()=>{
            const a=document.querySelector('#boardArea').getBoundingClientRect();
            const c=document.querySelector('#gameCanvas').getBoundingClientRect();
            const nav=document.querySelector('#levelsSection').getBoundingClientRect();
            const p=document.querySelector('#settingsPanel').getBoundingClientRect();
            const act=document.querySelector('.actionbar').getBoundingClientRect();
            const header=document.querySelector('header').getBoundingClientRect();
            return {board:{x:a.x,y:a.y,width:a.width,height:a.height},canvas:{x:c.x,y:c.y,width:c.width,height:c.height},nav:{x:nav.x,y:nav.y,width:nav.width,height:nav.height},panel:{x:p.x,y:p.y,width:p.width,height:p.height,bottom:p.bottom},actions:{x:act.x,y:act.y,width:act.width,height:act.height},header:{height:header.height}};
          });
          assert.ok(immersive.board.x<2 && immersive.board.y<2,'Playfield must start at screen origin '+JSON.stringify(immersive));
          assert.ok(immersive.board.width>=1438,'Playfield must fill horizontal viewport '+JSON.stringify(immersive));
          assert.ok(immersive.canvas.height>=890,'Canvas must be fullscreen '+JSON.stringify(immersive));
          assert.ok(immersive.nav.y<160&&immersive.nav.height<110,'Planet navigation should float at top '+JSON.stringify(immersive));
          assert.ok(immersive.panel.x>1050,'Controls should be overlay rail on right '+JSON.stringify(immersive));
          assert.ok(immersive.panel.height<500,'Rail should fit content without an empty full-height block '+JSON.stringify(immersive));
          assert.ok(immersive.actions.y>770,'Action controls should float along bottom '+JSON.stringify(immersive));
          const seamless=await page.evaluate(()=>{
            const rail=getComputedStyle(document.querySelector('#settingsPanel'));
            const outer=getComputedStyle(document.querySelector('.actionbar'));
            const stage=getComputedStyle(document.querySelector('#levelList .level-btn'));
            return {railBackground:rail.backgroundImage,railBlur:rail.backdropFilter,actionBorder:outer.borderTopWidth,actionBackground:outer.backgroundColor,stageRadius:stage.borderTopLeftRadius};
          });
          assert.ok(seamless.railBackground.includes('linear-gradient'),'Right control rail should feather into the cosmos');
          assert.equal(seamless.railBlur,'none','World rail should not blur the scenery behind it');
          assert.equal(seamless.actionBorder,'0px','Bottom action controls should have no outer card');
          assert.equal(seamless.stageRadius,'0px','Stage navigation should not consist of pills');
          assert.equal(await page.locator('#hudControlBtn').getAttribute('aria-expanded'),'true');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'Hiding HUD rail should leave canvas visible');
          assert.equal(await page.locator('#hudControlBtn').getAttribute('aria-expanded'),'false');
          assert.equal(await page.locator('#fullscreenBtn').isVisible(),true,'Fullscreen control missing');
          await page.keyboard.press('h');
          assert.equal(await page.locator('#settingsPanel').isVisible(),true,'H shortcut should reopen controls');
          await page.keyboard.press('h');
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'H shortcut should hide controls');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true,'HUD rail should reopen');
          // Mission info defaults to a compact three-line console status, story on demand.
          assert.equal(await page.locator('#missionStory').isVisible(),false);
          await page.locator('#missionInfoBtn').click();
          assert.equal(await page.locator('#missionStory').isVisible(),true);
          assert.equal(await page.locator('#missionInfoBtn').getAttribute('aria-expanded'),'true');
          await page.locator('#missionInfoBtn').click();
          assert.equal(await page.locator('#missionStory').isVisible(),false);
          assert.equal(await page.locator('#missionObjective').count(),1);
          assert.match(await page.locator('#missionObjective').textContent(),/收集 2 座補給站/);
          assert.match(await page.locator('#missionStory').textContent(),/殖民地/);
          await page.locator('#tutorial').waitFor({state:'visible',timeout:4000});
          assert.match(await page.locator('#tutorialTitle').textContent(),/補給站/);
          await page.locator('#tutorialSkip').click();
          assert.equal(await page.locator('#tutorial').isVisible(),false);
          assert.equal(await page.evaluate(()=>localStorage.getItem('orbit-code-tutorial-v09')),'done');
          await page.locator('#levelList .level-btn').nth(1).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),0,'Locked level should not open');
          assert.match(await page.locator('#stageNotice').textContent(),/先完成第 1 關/);
          assert.equal(await page.locator('#stageNotice').isVisible(),true);
          assert.equal(await page.locator('#timerMetric').count(),0,'Countdown must not be shown');
          assert.equal(await page.locator('#timeFill').count(),0,'Time bar must not be shown');
          assert.equal(await page.locator('#resultOverlay').count(),0,'Modal completion overlay must not exist');
          assert.equal(await page.evaluate(()=>('remaining' in window.__ORBIT_DEBUG__.state)),false,'Timer state must be removed');
          const integration=await page.evaluate(()=>({headerControls:document.querySelector('.board-header').contains(document.querySelector('.actionbar')),headerMetrics:document.querySelector('.board-header').contains(document.querySelector('.metrics')),stageHeight:document.querySelector('#levelsSection').getBoundingClientRect().height,stageCount:document.querySelectorAll('.level-btn').length}));
          assert.equal(integration.headerControls,true);
          assert.equal(integration.headerMetrics,true);
          assert.equal(integration.stageCount,6);
          assert.ok(integration.stageHeight<=98,'Planet+stage navigation too tall: '+JSON.stringify(integration));
          const pixelRange=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            const sample=(x,y)=>Array.from(g.getImageData(Math.floor(x*c.width),Math.floor(y*c.height),1,1).data).slice(0,3);
            const a=sample(.06,.06),b=sample(.87,.78);
            return {a,b,distance:a.reduce((sum,v,i)=>sum+Math.abs(v-b[i]),0)};
          });
          assert.ok(pixelRange.distance>1,'Classic cosmic background has no depth: '+JSON.stringify(pixelRange));
          // Verify restored cosmic scene is visible and user can switch to minimal mode.
          assert.equal(await page.locator('#advancedOptions').getAttribute('open'),null,'Advanced settings should be folded by default');
          assert.equal(await page.locator('#wheelTabs .wheel-tab').count(),1);
          assert.equal(await page.locator('#sceneBtn').isVisible(),false,'Advanced controls must stay folded');
          await page.locator('#advancedOptions summary').click();
          assert.equal(await page.locator('#sceneBtn').isVisible(),true,'Expanded advanced scene control hidden');
          assert.equal(await page.locator('#wheelControls .wheel:visible').count(),1,'Only current wheel editor should be visible');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          const classicPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),false);
          const minimalPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          const sceneDifference=classicPixels.flat().reduce((sum,value,i)=>sum+Math.abs(value-minimalPixels.flat()[i]),0);
          assert.ok(sceneDifference>65,'Original space scene absent: difference '+sceneDifference);
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          await page.locator('#advancedOptions summary').click();
          assert.equal(await page.locator('#sceneBtn').isVisible(),false,'Advanced options did not collapse');
          await page.screenshot({path:'desktop-v12.png',fullPage:true});
          const first=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          const handle=await page.evaluate(()=>window.__ORBIT_DEBUG__.wheelGeometry()[0]);
          const rect=await page.locator('#gameCanvas').boundingBox();
          await page.mouse.move(rect.x+handle.tx,rect.y+handle.ty);
          await page.mouse.down();
          await page.mouse.move(rect.x+handle.tx+26,rect.y+handle.ty,{steps:7});
          await page.mouse.up();
          const dragged=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          assert.notEqual(dragged,first,'Radius drag did not update');
          await page.locator('#plusCircle').click();
          await page.locator('#plusCircle').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length),3);
          assert.equal(await page.locator('#plusCircle').isDisabled(),true);
          assert.equal(await page.locator('#wheelTabs .wheel-tab').count(),3,'Wheel tabs not created');
          await page.locator('#wheelTabs .wheel-tab').nth(1).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.selectedWheel),1);
          assert.equal(await page.locator('#wheelControls .wheel:visible').count(),1);
          const beforeRadius=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r);
          await page.locator('#wheelControls .wheel:visible input[type="range"]').fill('84');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r),84);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r),dragged,'Editing second wheel changed first wheel');
          await page.locator('#wheelTabs .wheel-tab').nth(0).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.selectedWheel),0);
          assert.notEqual(beforeRadius,84,'Radius test should change a value');
          const results=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__,out=[];
            for(const lvl of d.levels){
              const steps=5000,found=new Set();let hitHazard=false;
              let prev=d.pointAt(0,lvl.refs);
              for(let j=1;j<=steps;j++){
                const t=lvl.max*j/steps,now=d.pointAt(t,lvl.refs);
                lvl.goals.forEach((g,k)=>{if(d.segmentDistance(prev,now,g)<=lvl.captureRadius)found.add(k)});
                if(lvl.hazards.some(h=>d.segmentDistance(prev,now,h)<=h.r+4))hitHazard=true;
                prev=now;
              }
              out.push({name:lvl.name,hit:found.size,goals:lvl.goals.length,collision:hitHazard});
            }
            return out;
          });
          for(const r of results){assert.equal(r.hit,r.goals,r.name+' missed goal');assert.equal(r.collision,false,r.name+' hit hazard')}
          // Hazard preview has defined red danger segments for a deliberately risky radius.
          const hazardPreview=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__,l=d.levels[4],h=l.hazards[0],w=[{r:Math.hypot(h.x,h.y),d:1}];
            let dangerous=0;
            let a=d.pointAt(0,w);
            for(let i=1;i<=240;i++){
              const b=d.pointAt(i*8/240,w);
              if(d.segmentDistance(a,b,h)<=h.r+4)dangerous++;
              a=b;
            }
            return dangerous;
          });
          assert.ok(hazardPreview>0,'Hazard intersection sample missing');
          // Complete a level by collecting real goal positions; never stop the orbit on clear.
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.setLevel(0);
            d.state.wheels=d.levels[0].refs.map(w=>({...w}));
            d.start();
            for(const g of d.levels[0].goals)d.collision(g,g);
          });
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.cleared),true,'Level not cleared');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running','Orbit stopped on clear');
          assert.equal(await page.locator('#completionPanel').isVisible(),true,'Completion UI is not visible');
          assert.equal(await page.locator('#completionStars').textContent(),'★★★');
          assert.match(await page.locator('#completionFacts').textContent(),/1 個圓 · 碰撞 0 次/);
          assert.equal(await page.locator('#completionBonus').isVisible(),true);
          const savedBest=await page.evaluate(()=>JSON.parse(localStorage.getItem('orbit-code-progress')).best['0']);
          assert.deepEqual(savedBest,{stars:3,hits:0,wheels:1,single:true});
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.pickupFx.length),2,'Pickup animation effects not spawned');
          assert.equal(await page.locator('#nextSideBtn').isVisible(),true,'Next-level button not shown in right console');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),false,'Mobile-only next button shown on desktop');
          await page.evaluate(()=>window.__ORBIT_DEBUG__.state.t=1000);
          await page.waitForTimeout(180);
          const afterClear=await page.evaluate(()=>({t:window.__ORBIT_DEBUG__.state.t,mode:window.__ORBIT_DEBUG__.state.mode,cleared:window.__ORBIT_DEBUG__.state.cleared}));
          assert.ok(afterClear.t>1000,'Orbit does not continue after victory: '+JSON.stringify(afterClear));
          assert.equal(afterClear.mode,'running');
          await page.screenshot({path:'desktop-v12-clear.png',fullPage:true});
          // Replaying with worse collisions must not erase the previous best score.
          await page.locator('#retrySideBtn').click();
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.state.hits=3;
            d.start();
            for(const g of d.levels[0].goals)d.collision(g,g);
          });
          assert.equal(await page.locator('#completionStars').textContent(),'★☆☆');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.best[0].stars),3);
          await page.locator('#nextSideBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),1,'Next-level action did not switch level');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'ready','Next level should be ready');
          assert.equal(await page.locator('#completionPanel').isVisible(),false,'Previous completion still visible');
          // Persistent progress and tutorial preference survive a fresh visit.
          await page.reload({waitUntil:'networkidle'});
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.best[0].stars),3,'Best score did not persist');
          assert.ok(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked)>=2,'Unlocked stages lost after reload');
          assert.equal(await page.locator('#tutorial').isVisible(),false,'Skipped tutorial should not reappear');
          await page.evaluate(()=>window.__ORBIT_DEBUG__.setLevel(1));
          // Verify prior V0.9 six-stage saves migrate without losing stars.
          await page.evaluate(()=>{
            localStorage.setItem('orbit-code-progress',JSON.stringify({unlocked:6,complete:{'0':true,'1':true,'2':true,'3':true,'4':true,'5':true},best:{'0':{stars:3,hits:0,wheels:1,single:true}}}));
          });
          await page.reload({waitUntil:'networkidle'});
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked),7,'Completed planet one should unlock second planet');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.best[0].stars),3,'Previous best stars lost');
          await page.locator('#planetBar .planet-btn').nth(1).click();
          assert.match(await page.locator('#levelProgress').textContent(),/霜環星/);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          assert.equal(await page.locator('#levelList .level-btn').nth(0).getAttribute('data-locked'),'false');
          assert.equal(await page.locator('#levelList .level-btn').nth(1).getAttribute('data-locked'),'true');
          await page.locator('#planetBar .planet-btn').nth(2).click();
          assert.match(await page.locator('#stageNotice').textContent(),/完成「霜環星」第 6 關/);
          const worldSamples=[];
          const samplePlanet=async level=>{
            await page.evaluate(i=>{
              const d=window.__ORBIT_DEBUG__;
              d.state.unlocked=Math.max(d.state.unlocked,i+1);
              d.setLevel(i);
            },level);
            await page.waitForTimeout(90);
            const sample=await page.evaluate(()=>{
              const c=document.getElementById('gameCanvas'),g=c.getContext('2d');
              return [...g.getImageData(Math.floor(c.width*.04),Math.floor(c.height*.48),1,1).data].slice(0,3);
            });
            worldSamples.push(sample);return sample;
          };
          await samplePlanet(0);await page.screenshot({path:'desktop-v12-origin.png',fullPage:true});
          await samplePlanet(6);await page.screenshot({path:'desktop-v12-frost.png',fullPage:true});
          await samplePlanet(12);await page.screenshot({path:'desktop-v12-ember.png',fullPage:true});
          assert.ok(worldSamples[0].some((v,i)=>Math.abs(v-worldSamples[1][i])>5),'Second planet background must differ');
          assert.ok(worldSamples[1].some((v,i)=>Math.abs(v-worldSamples[2][i])>5),'Third planet background must differ');
          // All 18 levels clear without a modal, and each next stage unlocks sequentially.
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.state.unlocked=1;
            for(let i=0;i<d.levels.length;i++){
              d.setLevel(i);
              if(d.state.level!==i)throw Error('Stage '+(i+1)+' did not unlock');
              d.state.wheels=d.levels[i].refs.map(w=>({...w}));
              d.start();
              for(const goal of d.levels[i].goals)d.collision(goal,goal);
              if(!d.state.cleared||d.state.mode!=='running')throw Error('Stage '+(i+1)+' did not clear nonmodally');
            }
          });
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked),18);
          assert.equal(await page.evaluate(()=>Object.keys(window.__ORBIT_DEBUG__.state.complete).filter(k=>window.__ORBIT_DEBUG__.state.complete[k]).length),18);
          assert.equal(await page.locator('#nextSideBtn').textContent(),'↻ 再次挑戰');
          await page.reload({waitUntil:'networkidle'});
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked),18,'Planet progress lost after reload');
          assert.equal(await page.evaluate(()=>Object.keys(window.__ORBIT_DEBUG__.state.best).length),18,'Best records not persisted');
          await page.evaluate(()=>window.__ORBIT_DEBUG__.setLevel(12));
          const sizes=[{width:1440,height:900},{width:1366,height:768},{width:1024,height:720},{width:820,height:900},{width:390,height:844},{width:375,height:667},{width:320,height:568},{width:844,height:390}];
          const layouts=[];
          for(const size of sizes){
            await page.setViewportSize(size);
            await page.waitForTimeout(100);
            const fit=await page.evaluate(()=>{
              const board=document.getElementById('boardArea').getBoundingClientRect();
              const dock=document.querySelector('.mobile-dock').getBoundingClientRect();
              const start=document.getElementById('startBtn').getBoundingClientRect();
              const actions=document.querySelector('.actionbar').getBoundingClientRect();
              return {vw:innerWidth,vh:innerHeight,w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight,boardH:board.height,boardW:board.width,dockBottom:dock.bottom,startBottom:start.bottom,actionH:actions.height,actionW:actions.width};
            });
            assert.ok(fit.w<=size.width+1,'Horizontal scroll at '+size.width+'x'+size.height+': '+JSON.stringify(fit));
            assert.ok(fit.h<=size.height+1,'Vertical scroll at '+size.width+'x'+size.height+': '+JSON.stringify(fit));
            assert.ok(fit.boardH>=size.height-2,'Immersive canvas should fill the full viewport: '+JSON.stringify(fit));
            assert.ok(fit.startBottom<=size.height,'Start button outside screen '+JSON.stringify(fit));
            if(size.width<=860){
              assert.ok(fit.dockBottom<=size.height+1,'Mobile dock not visible: '+JSON.stringify(fit));
              assert.ok(fit.actionH<=52,'Mobile flight controls must be one horizontal row: '+JSON.stringify(fit));
              assert.ok(fit.actionW<=size.width-10,'Mobile flight controls overflow: '+JSON.stringify(fit));
            }
            layouts.push(fit);
          }
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(100);
          assert.equal(await page.locator('#settingsPanel').isVisible(),false);
          assert.equal(await page.locator('#hudControlBtn').isVisible(),true);
          assert.equal(await page.locator('#hudControlBtn').getAttribute('aria-expanded'),'false');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true,'Top-right settings must open mobile controls');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'Top-right settings must close mobile controls');
          await page.locator('#dockSettings').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true);
          assert.equal(await page.locator('#dockSettings').getAttribute('aria-expanded'),'true');
          assert.equal(await page.locator('#wheelTabs .wheel-tab').count(),3);
          assert.equal(await page.locator('#wheelControls .wheel:visible').count(),1);
          assert.equal(await page.locator('#sceneBtn').isVisible(),false,'Advanced settings should be folded on mobile');
          await page.locator('#advancedOptions summary').click();
          assert.equal(await page.locator('#sceneBtn').isVisible(),true,'Mobile advanced background switch hidden');
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),false);
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          await page.locator('#advancedOptions summary').click();
          // Planet three starts with two/three wheels; normalize before checking controls.
          while(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length)>1)await page.locator('#minusCircle').click();
          await page.locator('#plusCircle').click();
          await page.locator('#plusCircle').click();
          assert.equal(await page.locator('#plusCircle').isDisabled(),true);
          const wheelCount=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length);
          assert.equal(wheelCount,3,'Mobile circle control broken');
          await page.locator('#dockLevels').click();
          assert.equal(await page.locator('#levelsSection').isVisible(),true);
          assert.equal(await page.locator('#settingsPanel').isVisible(),false);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          assert.equal(await page.locator('#planetBar .planet-btn').count(),3);
          await page.locator('#planetBar .planet-btn').nth(1).click();
          assert.match(await page.locator('#levelProgress').textContent(),/霜環星/);
          await page.locator('#planetBar .planet-btn').nth(2).click();
          assert.match(await page.locator('#levelProgress').textContent(),/赤曜星/);
          await page.keyboard.press('Escape');
          assert.equal(await page.locator('#levelsSection').isVisible(),false);
          await page.screenshot({path:'mobile-v12.png',fullPage:true});
          // On phones show a fixed next-level action without forcing a modal or settings drawer.
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.state.wheels=d.levels[d.state.level].refs.map(w=>({...w}));
            d.start();
            for(const g of d.levels[d.state.level].goals)d.collision(g,g);
          });
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.cleared),true);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),true,'Mobile next button unavailable');
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'Mobile overlay drawer should stay closed');
          await page.screenshot({path:'mobile-v12-clear.png',fullPage:true});
          await page.locator('#nextDockBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),13,'Mobile next level click failed');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),false,'Next button did not hide after advancing');

          await page.locator('#startBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running');
          await page.locator('#startBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'paused');
          await page.locator('#resetBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'ready');
          assert.equal(errors.length,0,'Uncaught browser errors '+errors.join('; '));
          console.log(JSON.stringify({status:'PASS',checks,dragBefore:first,dragAfter:dragged,results,layouts,sceneDifference,integration,afterClear,hazardPreview,savedBest,worldSamples,immersive,seamless,beforeRadius}));
          await browser.close();
          NODE
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v12-console-game-hud-qa
          path: |
            desktop-v12.png
            mobile-v12.png
            desktop-v12-clear.png
            mobile-v12-clear.png
            desktop-v12-origin.png
            desktop-v12-frost.png
            desktop-v12-ember.png
          if-no-files-found: ignore
