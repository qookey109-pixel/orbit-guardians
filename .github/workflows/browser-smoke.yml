          console.log(JSON.stringify({status:'PASS',checks,focusedPanel,flightClarity,worldVisuals,mobileTouchTargets,dragBefore:first,dragAfter:dragged,results,layouts,sceneDifference,integration,afterClear,hazardPreview,savedBest,worldSamples,immersive,seamless,beforeRadius,savedParameters,mobileBefore,sharedUrl,gamepadAudit,planetUnlockAudit,finalJourney,reduced}));
          await browser.close();
