name: Orbit endless nonmodal progression QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check game in Chromium (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/orbit-server.log 2>&1 &
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
          assert.match(await page.title(),/Endless Orbit V0\.8/);
          const checks=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            return {stages:d?.levels?.length,max:d?.MAX_WHEELS,styleCount:document.querySelectorAll('style').length,hiddenDecor:getComputedStyle(document.querySelector('.space-caption')).display==='none',noOldScanline:getComputedStyle(document.body,'::after').content==='none',visual:d?.visual,overflow:document.documentElement.scrollWidth-innerWidth,verticalOverflow:document.documentElement.scrollHeight-innerHeight,canvasHeight:document.querySelector('#boardArea').getBoundingClientRect().height};
          });
          assert.deepEqual(checks.stages,6);
          assert.deepEqual(checks.max,3);
          assert.equal(checks.visual.ship,'round-scout');
          assert.equal(checks.visual.goal,'supply-station');
          assert.equal(checks.visual.hazard,'navigation-mine');
          assert.equal(checks.visual.layout,'integrated');
          assert.equal(checks.visual.background,'classic-cosmos');
          assert.equal(checks.visual.completion,'nonmodal');
          assert.equal(checks.visual.timeLimit,false);
          assert.deepEqual(checks.styleCount,1);
          assert.equal(checks.hiddenDecor,true);
          assert.equal(checks.noOldScanline,true);
          assert.ok(checks.overflow<2,'Desktop horizontal overflow '+checks.overflow);
          assert.ok(checks.verticalOverflow<2,'Desktop vertical overflow '+checks.verticalOverflow);
          assert.ok(checks.canvasHeight>600,'Integrated desktop canvas should exceed 600px '+checks.canvasHeight);
          assert.equal(await page.locator('#timerMetric').count(),0,'Countdown must not be shown');
          assert.equal(await page.locator('#timeFill').count(),0,'Time bar must not be shown');
          assert.equal(await page.locator('#resultOverlay').count(),0,'Modal completion overlay must not exist');
          assert.equal(await page.evaluate(()=>('remaining' in window.__ORBIT_DEBUG__.state)),false,'Timer state must be removed');
          const integration=await page.evaluate(()=>({headerControls:document.querySelector('.board-header').contains(document.querySelector('.actionbar')),headerMetrics:document.querySelector('.board-header').contains(document.querySelector('.metrics')),stageHeight:document.querySelector('#levelsSection').getBoundingClientRect().height,stageCount:document.querySelectorAll('.level-btn').length}));
          assert.equal(integration.headerControls,true);
          assert.equal(integration.headerMetrics,true);
          assert.equal(integration.stageCount,6);
          assert.ok(integration.stageHeight<=45,'Stage selector not compact: '+JSON.stringify(integration));
          const pixelRange=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            const sample=(x,y)=>Array.from(g.getImageData(Math.floor(x*c.width),Math.floor(y*c.height),1,1).data).slice(0,3);
            const a=sample(.06,.06),b=sample(.87,.78);
            return {a,b,distance:a.reduce((sum,v,i)=>sum+Math.abs(v-b[i]),0)};
          });
          assert.ok(pixelRange.distance>1,'Classic cosmic background has no depth: '+JSON.stringify(pixelRange));
          // Verify restored cosmic scene is visible and user can switch to minimal mode.
          assert.equal(await page.locator('#sceneBtn').isVisible(),true,'Desktop background toggle hidden');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          const classicPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),false);
          const minimalPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          const sceneDifference=classicPixels.flat().reduce((sum,value,i)=>sum+Math.abs(value-minimalPixels.flat()[i]),0);
          assert.ok(sceneDifference>65,'Original space scene absent: difference '+sceneDifference);
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          await page.screenshot({path:'desktop-v08.png',fullPage:true});
          const first=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          const handle=await page.evaluate(()=>window.__ORBIT_DEBUG__.wheelGeometry()[0]);
          const rect=await page.locator('#gameCanvas').boundingBox();
          await page.mouse.move(rect.x+handle.tx,rect.y+handle.ty);
          await page.mouse.down();
          await page.mouse.move(rect.x+handle.tx+26,rect.y+handle.ty,{steps:7});
          await page.mouse.up();
          const dragged=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          assert.notEqual(dragged,first,'Radius drag did not update');
          await page.locator('#plusCircle').click();
          await page.locator('#plusCircle').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length),3);
          assert.equal(await page.locator('#plusCircle').isDisabled(),true);
          const results=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__,out=[];
            for(const lvl of d.levels){
              const steps=5000,found=new Set();let hitHazard=false;
              let prev=d.pointAt(0,lvl.refs);
              for(let j=1;j<=steps;j++){
                const t=lvl.max*j/steps,now=d.pointAt(t,lvl.refs);
                lvl.goals.forEach((g,k)=>{if(d.segmentDistance(prev,now,g)<=lvl.captureRadius)found.add(k)});
                if(lvl.hazards.some(h=>d.segmentDistance(prev,now,h)<=h.r+4))hitHazard=true;
                prev=now;
              }
              out.push({name:lvl.name,hit:found.size,goals:lvl.goals.length,collision:hitHazard});
            }
            return out;
          });
          for(const r of results){assert.equal(r.hit,r.goals,r.name+' missed goal');assert.equal(r.collision,false,r.name+' hit hazard')}
          // Complete a level by collecting real goal positions; never stop the orbit on clear.
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.setLevel(0);
            d.state.wheels=d.levels[0].refs.map(w=>({...w}));
            d.start();
            for(const g of d.levels[0].goals)d.collision(g,g);
          });
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.cleared),true,'Level not cleared');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running','Orbit stopped on clear');
          assert.equal(await page.locator('#completionPanel').isVisible(),true,'Completion UI is not visible');
          assert.equal(await page.locator('#nextSideBtn').isVisible(),true,'Next-level button not shown in right console');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),false,'Mobile-only next button shown on desktop');
          await page.evaluate(()=>window.__ORBIT_DEBUG__.state.t=1000);
          await page.waitForTimeout(180);
          const afterClear=await page.evaluate(()=>({t:window.__ORBIT_DEBUG__.state.t,mode:window.__ORBIT_DEBUG__.state.mode,cleared:window.__ORBIT_DEBUG__.state.cleared}));
          assert.ok(afterClear.t>1000,'Orbit does not continue after victory: '+JSON.stringify(afterClear));
          assert.equal(afterClear.mode,'running');
          await page.screenshot({path:'desktop-v08-clear.png',fullPage:true});
          await page.locator('#nextSideBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),1,'Next-level action did not switch level');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'ready','Next level should be ready');
          assert.equal(await page.locator('#completionPanel').isVisible(),false,'Previous completion still visible');
          const sizes=[{width:1440,height:900},{width:1366,height:768},{width:1024,height:720},{width:820,height:900},{width:390,height:844},{width:375,height:667},{width:320,height:568},{width:844,height:390}];
          const layouts=[];
          for(const size of sizes){
            await page.setViewportSize(size);
            await page.waitForTimeout(100);
            const fit=await page.evaluate(()=>{
              const board=document.getElementById('boardArea').getBoundingClientRect();
              const dock=document.querySelector('.mobile-dock').getBoundingClientRect();
              const start=document.getElementById('startBtn').getBoundingClientRect();
              return {vw:innerWidth,vh:innerHeight,w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight,boardH:board.height,boardW:board.width,dockBottom:dock.bottom,startBottom:start.bottom};
            });
            assert.ok(fit.w<=size.width+1,'Horizontal scroll at '+size.width+'x'+size.height+': '+JSON.stringify(fit));
            assert.ok(fit.h<=size.height+1,'Vertical scroll at '+size.width+'x'+size.height+': '+JSON.stringify(fit));
            assert.ok(fit.boardH>=110,'Canvas too small at '+size.width+'x'+size.height+': '+JSON.stringify(fit));
            assert.ok(fit.startBottom<=size.height,'Start button outside screen '+JSON.stringify(fit));
            if(size.width<=860)assert.ok(fit.dockBottom<=size.height+1,'Mobile dock not visible: '+JSON.stringify(fit));
            layouts.push(fit);
          }
          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(100);
          assert.equal(await page.locator('#settingsPanel').isVisible(),false);
          await page.locator('#dockSettings').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true);
          assert.equal(await page.locator('#dockSettings').getAttribute('aria-expanded'),'true');
          assert.equal(await page.locator('#sceneBtn').isVisible(),true,'Mobile background toggle hidden');
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),false);
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          await page.locator('#minusCircle').click();
          await page.locator('#plusCircle').click();
          const wheelCount=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length);
          assert.equal(wheelCount,3,'Mobile circle control broken');
          await page.locator('#dockLevels').click();
          assert.equal(await page.locator('#levelsSection').isVisible(),true);
          assert.equal(await page.locator('#settingsPanel').isVisible(),false);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          await page.keyboard.press('Escape');
          assert.equal(await page.locator('#levelsSection').isVisible(),false);
          await page.screenshot({path:'mobile-v08.png',fullPage:true});
          // On phones show a fixed next-level action without forcing a modal or settings drawer.
          await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            d.state.wheels=d.levels[d.state.level].refs.map(w=>({...w}));
            d.start();
            for(const g of d.levels[d.state.level].goals)d.collision(g,g);
          });
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.cleared),true);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),true,'Mobile next button unavailable');
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'Mobile overlay drawer should stay closed');
          await page.screenshot({path:'mobile-v08-clear.png',fullPage:true});
          await page.locator('#nextDockBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),2,'Mobile next level click failed');
          assert.equal(await page.locator('#nextDockBtn').isVisible(),false,'Next button did not hide after advancing');

          await page.locator('#startBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'running');
          await page.locator('#startBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'paused');
          await page.locator('#resetBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.mode),'ready');
          assert.equal(errors.length,0,'Uncaught browser errors '+errors.join('; '));
          console.log(JSON.stringify({status:'PASS',checks,dragBefore:first,dragAfter:dragged,results,layouts,sceneDifference,integration,afterClear}));
          await browser.close();
          NODE
      - name: Attach screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-v08-endless-progression-qa
          path: |
            desktop-v073.png
            mobile-v08.png
            desktop-v08-clear.png
            mobile-v08-clear.png
          if-no-files-found: ignore
