name: Orbit V1.18 UI focus and cross-browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently verify published mission geometry
        run: node tools/verify-orbit-levels.mjs
      - name: Validate offline Level Workshop and generate review-only sample
        run: |
          node tools/test-level-workshop.mjs
          node tools/generate-level-candidates.mjs --seed 20261011 --difficulty hard --count 3 --output research/workshop-candidates.json
          node tools/test-level-workshop.mjs research/workshop-candidates.json
          node tools/test-level-review-lab.mjs
          echo "REVIEW_SAMPLE_JSON_BEGIN"
          cat research/workshop-candidates.json
          echo "REVIEW_SAMPLE_JSON_END"
      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Check game in Chromium (desktop and mobile)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/orbit-server.log 2>&1 &
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          const page=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:8765/',{waitUntil:'networkidle'});
          assert.equal(await page.title(),'ORBIT // CODE｜軌道守護者');
          const checks=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            return {stages:d?.levels?.length,max:d?.MAX_WHEELS,styleCount:document.querySelectorAll('style').length,hiddenDecor:getComputedStyle(document.querySelector('.space-caption')).display==='none',noOldScanline:getComputedStyle(document.body,'::after').content==='none',visual:d?.visual,overflow:document.documentElement.scrollWidth-innerWidth,verticalOverflow:document.documentElement.scrollHeight-innerHeight,canvasHeight:document.querySelector('#boardArea').getBoundingClientRect().height};
          });
          assert.deepEqual(checks.stages,18);
          assert.equal(checks.visual.planets,3);
          assert.equal(checks.visual.levelsPerPlanet,6);
          assert.equal(await page.locator('#planetBar .planet-btn').count(),3);
          assert.equal(await page.locator('#planetAchievement').count(),1);
          assert.equal(await page.locator('#planetAchievement').isVisible(),false);
          assert.equal(await page.locator('#gamepadStatus').isVisible(),false);
          assert.equal(await page.locator('#levelList .level-btn').count(),6);
          assert.equal(await page.locator('#journeySummary').textContent(),'0 / 18 關');
          assert.equal(await page.locator('#journeyProgress [role=progressbar]').getAttribute('aria-valuenow'),'0');
          assert.match(await page.locator('#planetBar .planet-btn').nth(0).getAttribute('aria-label'),/0\/6 關/);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.lastLevel),0);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.unlocked),1);
          assert.deepEqual(checks.max,3);
          assert.equal(checks.visual.ship,'round-scout');
          assert.equal(checks.visual.goal,'supply-station');
          assert.equal(checks.visual.hazard,'navigation-mine');
          assert.equal(checks.visual.layout,'focus-hud');
          assert.equal(checks.visual.motion,'native-canvas');
          assert.equal(checks.visual.motionDurationMs,640);
          assert.equal(checks.visual.predictionRevealMs,520);
          const scripts=await page.locator('script[src]').evaluateAll(els=>els.map(el=>new URL(el.src).pathname));
          assert.deepEqual(scripts,['/src/levels.js'],'Only the first-party static mission catalog may load');
          assert.equal(await page.evaluate(()=>window.ORBIT_LEVEL_DATA?.levels?.length),18);
          assert.equal(await page.evaluate(()=>window.ORBIT_LEVEL_DATA.levels===window.__ORBIT_DEBUG__.levels),true,
            'The game and independent catalog must use exactly the same 18 level objects');
          assert.equal(checks.visual.quietHUD,true);
          assert.equal(await page.locator('.header-right .nav-link').count(),0);
          assert.equal(await page.locator('.live-readout').isVisible(),false);
          assert.equal(await page.locator('.state-chip').isVisible(),false);
          assert.equal(await page.locator('.canvas-hint').isVisible(),false);
          assert.equal(await page.locator('.count-row').count(),0,'Remove redundant wheel number row, not just hide');
          assert.equal(await page.locator('.control-caption,.panel-intro').count(),0);
          assert.equal(await page.locator('#wheelNumber,#plusCircle,#minusCircle').count(),0);
          assert.equal(await page.locator('#wheelCountHint').textContent(),'1 / 3 圓');
          assert.equal(await page.locator('.planet-btn.locked .planet-status:visible').count(),0);
          assert.equal(await page.locator('#wheelTabs .wheel-count-shortcut').count(),2);
          const focusedPanel=await page.evaluate(()=>{
            const panel=document.querySelector('#settingsPanel'),h=panel.querySelector('.console-header');
            const pStyle=getComputedStyle(panel),hStyle=getComputedStyle(h);
            const active=panel.querySelector('.wheel.selected'),aStyle=getComputedStyle(active);
            return {border:parseFloat(pStyle.borderTopWidth),shadow:pStyle.boxShadow,
              accent:parseFloat(hStyle.borderLeftWidth),activeBackground:aStyle.backgroundImage,
              sliderHeight:active.querySelector('input[type=range]').getBoundingClientRect().height,
              numericColor:getComputedStyle(active.querySelector('input[type=number]')).color};
          });
          assert.ok(focusedPanel.border>=1,'Control rail border not visible');
          assert.ok(focusedPanel.shadow!=='none','Control rail shadow missing');
          assert.ok(focusedPanel.accent>=3,'Warm gold header accent missing');
          assert.ok(focusedPanel.activeBackground!=='none','Selected ring editor must be emphasized');
          assert.ok(focusedPanel.sliderHeight>=20,'Radius slider not prominent enough');
          const flightClarity=await page.evaluate(()=>{
            const title=document.querySelector('.command-title');
            const metrics=document.querySelector('.board-header .metrics');
            const launch=document.querySelector('#startBtn');
            return {
              missionAccent:parseFloat(getComputedStyle(title,'::before').width),
              metricsBackground:getComputedStyle(metrics).backgroundImage,
              metricsBlur:getComputedStyle(metrics).backdropFilter,
              launchBackground:getComputedStyle(launch).backgroundImage,
              goalColor:getComputedStyle(document.querySelector('#goalMetric')).color,
              hazardColor:getComputedStyle(document.querySelector('#hazardMetric')).color
            };
          });
          assert.ok(flightClarity.missionAccent>=3,'Mission title must keep the warm-gold orientation line');
          assert.ok(flightClarity.metricsBackground.includes('linear-gradient'),'Metric readout must separate from scene');
          assert.notEqual(flightClarity.metricsBlur,'none','Metric readout must remain legible over the cosmos');
          assert.ok(flightClarity.launchBackground.includes('linear-gradient'),'Launch action gradient missing');
          assert.notEqual(flightClarity.goalColor,flightClarity.hazardColor,'Supply and hazard metrics must use distinct visual colors');
          assert.equal(await page.locator('#previewBtn').getAttribute('aria-pressed'),'true');
          assert.equal(await page.locator('#previewText').textContent(),'路線：開');
          assert.equal(await page.locator('svg.ui-symbols symbol').count(),16,'SVG icon catalog missing');
          const iconIds=['fullscreenBtn','hudControlBtn','startBtn','resetBtn','previewBtn','sceneBtn','soundBtn','shareBtn','restoreConfigBtn','referenceBtn','randomBtn','dockSettings','dockLevels'];
          for(const id of iconIds){
            const button=page.locator('#'+id);
            const icon=button.locator('svg.ui-icon use');
            assert.equal(await icon.count(),1,'Missing consistent SVG icon for '+id);
            const href=await icon.getAttribute('href');
            assert.equal(await page.locator('svg.ui-symbols '+href).count(),1,'Unresolved SVG symbol '+href);
          }
          assert.equal(await page.locator('header .brand small').isVisible(),false,'Decorative subtitle must not crowd first screen');
          assert.equal(await page.locator('.gamepad-help').evaluate(el=>el.open),false,'Gamepad legend must stay collapsed');
          // Ready-state forecast paths and unchanged telemetry must not be rebuilt per frame.
          const beforeIdle=await page.evaluate(()=>({...window.__ORBIT_DEBUG__.renderPerf}));
          await page.waitForTimeout(180);
          await page.evaluate(()=>{for(let i=0;i<4;i++)window.__ORBIT_DEBUG__.draw()});
          const afterIdle=await page.evaluate(()=>({...window.__ORBIT_DEBUG__.renderPerf}));
          assert.ok(afterIdle.forecastBuilds>=1,'Initial forecast never rendered');
          assert.equal(afterIdle.forecastBuilds,beforeIdle.forecastBuilds,'Unchanged orbit preview rebuilt while idle');
          assert.ok(afterIdle.forecastHits>beforeIdle.forecastHits,'No cached forecast reuse observed');
          assert.equal(afterIdle.hudWrites,beforeIdle.hudWrites,'HUD values rewritten without state change');
          assert.equal(checks.visual.settlement,false);
          assert.equal(checks.visual.starRating,false);
          assert.equal(await page.locator('#completionPanel').count(),0,'Settlement panel should be removed');
          assert.equal(await page.locator('#completionStars').count(),0);
          assert.equal(await page.locator('#completionFacts').count(),0);
          assert.equal(await page.locator('#retrySideBtn').count(),0);
          assert.equal(await page.locator('#journeyStars').count(),0);
          assert.equal(await page.locator('#clearNav').count(),1);
          assert.equal(await page.locator('#clearNav').isVisible(),false);
          assert.equal(await page.locator('.best-stars').count(),0);
          assert.equal(await page.evaluate(()=>document.body.innerText.includes('★')),false,'Stars are still visible');
          assert.equal(checks.visual.journeyProgress,true);
          assert.equal(checks.visual.resumeLastStage,true);
          assert.equal(checks.visual.gamepad,true);
          assert.equal(checks.visual.planetUnlock,'nonmodal');
          assert.equal(checks.visual.sonicFeedback,true);
          assert.equal(checks.visual.shareableOrbit,true);
          assert.equal(checks.visual.precision,true);
          assert.equal(checks.visual.customConfigs,true);
          assert.equal(checks.visual.background,'classic-cosmos');
          assert.equal(checks.visual.completion,'nonmodal');
          assert.equal(checks.visual.timeLimit,false);
          assert.equal(checks.visual.onboarding,true);
          assert.equal(checks.visual.prediction,'hazard-aware');
          assert.equal(checks.visual.scores,'persistent-best');
          assert.deepEqual(checks.styleCount,1);
          assert.equal(checks.hiddenDecor,true);
          assert.equal(checks.noOldScanline,true);
          assert.ok(checks.overflow<2,'Desktop horizontal overflow '+checks.overflow);
          assert.ok(checks.verticalOverflow<2,'Desktop vertical overflow '+checks.verticalOverflow);
          assert.ok(checks.canvasHeight>=890,'Desktop playfield must fill the viewport: '+checks.canvasHeight);
          const immersive=await page.evaluate(()=>{
            const a=document.querySelector('#boardArea').getBoundingClientRect();
            const c=document.querySelector('#gameCanvas').getBoundingClientRect();
            const nav=document.querySelector('#levelsSection').getBoundingClientRect();
            const p=document.querySelector('#settingsPanel').getBoundingClientRect();
            const act=document.querySelector('.actionbar').getBoundingClientRect();
            const header=document.querySelector('header').getBoundingClientRect();
            return {board:{x:a.x,y:a.y,width:a.width,height:a.height},canvas:{x:c.x,y:c.y,width:c.width,height:c.height},nav:{x:nav.x,y:nav.y,width:nav.width,height:nav.height},panel:{x:p.x,y:p.y,width:p.width,height:p.height,bottom:p.bottom},actions:{x:act.x,y:act.y,width:act.width,height:act.height},header:{height:header.height}};
          });
          assert.ok(immersive.board.x<2 && immersive.board.y<2,'Playfield must start at screen origin '+JSON.stringify(immersive));
          assert.ok(immersive.board.width>=1438,'Playfield must fill horizontal viewport '+JSON.stringify(immersive));
          assert.ok(immersive.canvas.height>=890,'Canvas must be fullscreen '+JSON.stringify(immersive));
          assert.ok(immersive.nav.y<160&&immersive.nav.height<110,'Planet navigation should float at top '+JSON.stringify(immersive));
          assert.ok(immersive.panel.x>1050,'Controls should be overlay rail on right '+JSON.stringify(immersive));
          assert.ok(immersive.panel.height<500,'Rail should fit content without an empty full-height block '+JSON.stringify(immersive));
          assert.ok(immersive.actions.y>770,'Action controls should float along bottom '+JSON.stringify(immersive));
          const seamless=await page.evaluate(()=>{
            const rail=getComputedStyle(document.querySelector('#settingsPanel'));
            const outer=getComputedStyle(document.querySelector('.actionbar'));
            const stage=getComputedStyle(document.querySelector('#levelList .level-btn'));
            return {railBackground:rail.backgroundImage,railBlur:rail.backdropFilter,actionBorder:outer.borderTopWidth,actionBackground:outer.backgroundColor,stageRadius:stage.borderTopLeftRadius};
          });
          assert.ok(seamless.railBackground.includes('linear-gradient'),'Right control rail should feather into the cosmos');
          assert.notEqual(seamless.railBlur,'none','Focused control rail should separate from cosmic scenery');
          assert.equal(seamless.actionBorder,'0px','Bottom action controls should have no outer card');
          assert.equal(seamless.stageRadius,'0px','Stage navigation should not consist of pills');
          assert.equal(await page.locator('#hudControlBtn').getAttribute('aria-expanded'),'true');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'Hiding HUD rail should leave canvas visible');
          assert.equal(await page.locator('#hudControlBtn').getAttribute('aria-expanded'),'false');
          assert.ok(await page.locator('#hudControlBtn').evaluate(el=>getComputedStyle(el).boxShadow!=='none'),
            'Collapsed rail toggle should remain visually prominent');
          assert.equal(await page.locator('#fullscreenBtn').isVisible(),true,'Fullscreen control missing');
          await page.keyboard.press('h');
          assert.equal(await page.locator('#settingsPanel').isVisible(),true,'H shortcut should reopen controls');
          await page.keyboard.press('h');
          assert.equal(await page.locator('#settingsPanel').isVisible(),false,'H shortcut should hide controls');
          await page.locator('#hudControlBtn').click();
          assert.equal(await page.locator('#settingsPanel').isVisible(),true,'HUD rail should reopen');
          // Mission info defaults to a compact three-line console status, story on demand.
          assert.equal(await page.locator('#missionStory').isVisible(),false);
          await page.locator('#missionInfoBtn').click();
          assert.equal(await page.locator('#missionStory').isVisible(),true);
          assert.equal(await page.locator('#missionInfoBtn').getAttribute('aria-expanded'),'true');
          await page.locator('#missionInfoBtn').click();
          assert.equal(await page.locator('#missionStory').isVisible(),false);
          assert.equal(await page.locator('#missionObjective').count(),1);
          assert.match(await page.locator('#missionObjective').textContent(),/收集 2 座補給站/);
          assert.match(await page.locator('#missionStory').textContent(),/殖民地/);
          await page.locator('#tutorial').waitFor({state:'visible',timeout:4000});
          assert.match(await page.locator('#tutorialTitle').textContent(),/補給站/);
          await page.locator('#tutorialSkip').click();
          assert.equal(await page.locator('#tutorial').isVisible(),false);
          assert.equal(await page.evaluate(()=>localStorage.getItem('orbit-code-tutorial-v09')),'done');
          await page.locator('#levelList .level-btn').nth(1).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.level),0,'Locked level should not open');
          assert.match(await page.locator('#stageNotice').textContent(),/先完成第 1 關/);
          assert.equal(await page.locator('#stageNotice').isVisible(),true);
          assert.equal(await page.locator('#timerMetric').count(),0,'Countdown must not be shown');
          assert.equal(await page.locator('#timeFill').count(),0,'Time bar must not be shown');
          assert.equal(await page.locator('#resultOverlay').count(),0,'Modal completion overlay must not exist');
          assert.equal(await page.evaluate(()=>('remaining' in window.__ORBIT_DEBUG__.state)),false,'Timer state must be removed');
          const integration=await page.evaluate(()=>({headerControls:document.querySelector('.board-header').contains(document.querySelector('.actionbar')),headerMetrics:document.querySelector('.board-header').contains(document.querySelector('.metrics')),stageHeight:document.querySelector('#levelsSection').getBoundingClientRect().height,stageCount:document.querySelectorAll('.level-btn').length}));
          assert.equal(integration.headerControls,true);
          assert.equal(integration.headerMetrics,true);
          assert.equal(integration.stageCount,6);
          assert.ok(integration.stageHeight<=98,'Planet+stage navigation too tall: '+JSON.stringify(integration));
          const pixelRange=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            const sample=(x,y)=>Array.from(g.getImageData(Math.floor(x*c.width),Math.floor(y*c.height),1,1).data).slice(0,3);
            const a=sample(.06,.06),b=sample(.87,.78);
            return {a,b,distance:a.reduce((sum,v,i)=>sum+Math.abs(v-b[i]),0)};
          });
          assert.ok(pixelRange.distance>1,'Classic cosmic background has no depth: '+JSON.stringify(pixelRange));
          // Verify restored cosmic scene is visible and user can switch to minimal mode.
          assert.equal(await page.locator('#advancedOptions').getAttribute('open'),null,'Advanced settings should be folded by default');
          assert.equal(await page.locator('#wheelTabs .wheel-tab').count(),1);
          assert.equal(await page.locator('#sceneBtn').isVisible(),false,'Advanced controls must stay folded');
          await page.locator('#advancedOptions > summary').click();
          assert.equal(await page.locator('#sceneBtn').isVisible(),true,'Expanded advanced scene control hidden');
          assert.equal(await page.locator('#soundBtn').isVisible(),true);
          assert.equal(await page.locator('#shareBtn').isVisible(),true);
          assert.equal(await page.locator('#soundBtn').getAttribute('aria-pressed'),'false','Sound should be off by default');
          await page.locator('#soundBtn').click();
          assert.equal(await page.locator('#soundBtn').getAttribute('aria-pressed'),'true');
          assert.equal(await page.locator('#soundBtn .ui-icon use').getAttribute('href'),'#oi-sound');
          assert.equal(await page.evaluate(()=>localStorage.getItem('orbit-code-sounds-v14')),'on');
          await page.locator('#soundBtn').click();
          assert.equal(await page.locator('#soundBtn').getAttribute('aria-pressed'),'false');
          assert.equal(await page.locator('#soundBtn .ui-icon use').getAttribute('href'),'#oi-mute');
          assert.equal(await page.evaluate(()=>localStorage.getItem('orbit-code-sounds-v14')),'off');
          assert.equal(await page.locator('#wheelControls .wheel:visible').count(),1,'Only current wheel editor should be visible');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          const classicPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),false);
          const minimalPixels=await page.evaluate(()=>{
            const c=document.querySelector('#gameCanvas'),g=c.getContext('2d');
            return [[.22,.93],[.83,.16],[.13,.17]].map(([x,y])=>Array.from(g.getImageData(Math.round(x*c.width),Math.round(y*c.height),1,1).data).slice(0,3));
          });
          const sceneDifference=classicPixels.flat().reduce((sum,value,i)=>sum+Math.abs(value-minimalPixels.flat()[i]),0);
          assert.ok(sceneDifference>65,'Original space scene absent: difference '+sceneDifference);
          await page.locator('#sceneBtn').click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showScenery),true);
          await page.locator('#advancedOptions > summary').click();
          assert.equal(await page.locator('#sceneBtn').isVisible(),false,'Advanced options did not collapse');
          await page.screenshot({path:'desktop-v118.png',fullPage:true});
          const first=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          const handle=await page.evaluate(()=>window.__ORBIT_DEBUG__.wheelGeometry()[0]);
          const rect=await page.locator('#gameCanvas').boundingBox();
          await page.mouse.move(rect.x+handle.tx,rect.y+handle.ty);
          await page.mouse.down();
          await page.mouse.move(rect.x+handle.tx+26,rect.y+handle.ty,{steps:7});
          await page.mouse.up();
          const dragged=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          assert.notEqual(dragged,first,'Radius drag did not update');
          await page.locator('#wheelTabs .wheel-count-shortcut').nth(1).click();
          await page.locator('#wheelTabs .wheel-count-shortcut').nth(1).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels.length),3);
          assert.equal(await page.locator('#wheelCountHint').textContent(),'3 / 3 圓');
          assert.equal(await page.locator('#wheelTabs .wheel-count-shortcut').nth(1).isDisabled(),true);
          assert.equal(await page.locator('#wheelTabs .wheel-tab').count(),3,'Wheel tabs not created');
          await page.locator('#wheelTabs .wheel-tab').nth(1).click();
          assert.equal(await page.locator('#wheelTabs .wheel-tab').nth(1).getAttribute('aria-pressed'),'true');
          assert.equal(await page.locator('#wheelTabs .wheel-tab').nth(0).getAttribute('aria-pressed'),'false');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.selectedWheel),1);
          assert.equal(await page.locator('#wheelControls .wheel:visible').count(),1);
          const beforeRadius=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r);
          await page.locator('#wheelControls .wheel:visible input[type="range"]').fill('84');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r),84);
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r),dragged,'Editing second wheel changed first wheel');
          await page.locator('#wheelTabs .wheel-tab').nth(0).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.selectedWheel),0);
          assert.notEqual(beforeRadius,84,'Radius test should change a value');
          // Microsteps control only the selected wheel and synchronize slider and numeric value.
          assert.equal(await page.locator('#wheelControls .wheel:visible .micro-btn').count(),4);
          assert.equal(await page.locator('#wheelControls .wheel:visible .radius-micro').isVisible(),false);
          await page.locator('#wheelControls .wheel:visible .precision-fold summary').click();
          assert.equal(await page.locator('#wheelControls .wheel:visible .radius-micro').isVisible(),true);
          const r0=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r);
          await page.locator('#wheelControls .wheel:visible .micro-btn').nth(3).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r),r0+5);
          await page.locator('#wheelControls .wheel:visible .micro-btn').nth(1).click();
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[0].r),r0+4);
          assert.ok(await page.evaluate(()=>performance.now()-window.__ORBIT_DEBUG__.state.motionAt<2000),'Editing should trigger motion feedback');
          assert.equal(Number(await page.locator('#wheelControls .wheel:visible input[type="number"]').inputValue()),r0+4);
          // Console shortcuts: number keys choose ring, arrows fine-tune, shift uses 5px steps, P previews.
          await page.locator('#wheelControls .wheel:visible .precision-fold summary').click();
          await page.keyboard.press('2');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.selectedWheel),1);
          await page.keyboard.press('Shift+ArrowRight');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r),89);
          await page.keyboard.press('ArrowLeft');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.wheels[1].r),88);
          const preKey=await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showPrediction);
          await page.keyboard.press('p');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showPrediction),!preKey);
          await page.keyboard.press('p');
          assert.equal(await page.evaluate(()=>window.__ORBIT_DEBUG__.state.showPrediction),preKey);
          assert.ok(await page.evaluate(()=>performance.now()-window.__ORBIT_DEBUG__.state.predictionRevealAt<1000),'Reenabling prediction should start a visual-only reveal');
          // Level-local parameters survive reload but never override the default automatically.
          const savedParameters=await page.evaluate(()=>{
            const d=window.__ORBIT_DEBUG__;
            const saved=JSON.parse(localStorage.getItem('orbit-code-user-configs-v13'));
            return {level:d.state.level,wheels:saved[d.state.level],original:d.state.wheels.map(w=>({r:w.r,d:w.d}))};
          });
          assert.deepEqual(savedParameters.wheels,savedParameters.original);
          await page.reload({waitUntil:'networkidle'});
